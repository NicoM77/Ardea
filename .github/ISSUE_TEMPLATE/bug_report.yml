name: Bug report
description: Something in Ardea does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For a security vulnerability, do not use this form; follow SECURITY.md in the repository.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Image tag or version
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options: [amd64, arm64]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output of `ardea doctor`
      description: Remove secrets and personal data first.
      render: text
