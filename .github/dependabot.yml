version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]
    # Packages bound to the .NET runtime stay on the 10.x line until the project moves to .NET 11.
    # Packages with their own versioning (Microsoft.Extensions.AI, Npgsql tooling outside EF) are not listed.
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.Http.Resilience"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.TimeProvider.Testing"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet-ef"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "EFCore.NamingConventions"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      web-minor-patch:
        update-types: [minor, patch]
    # Must match the Playwright image (mcr.microsoft.com/playwright:v1.56.1-noble) used for the visual baselines.
    # Bump it together with the image tag, the baselines and the other pins by hand, then remove this rule.
    # TypeScript follows the range Angular supports (@angular/compiler-cli peer dependency); a new major comes with
    # the Angular update that allows it.
    ignore:
      - dependency-name: "@playwright/test"
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      site-minor-patch:
        update-types: [minor, patch]
    # Must match the Playwright image, see the /web entry.
    ignore:
      - dependency-name: "@playwright/test"

  - package-ecosystem: npm
    directory: /tests/e2e
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      e2e-minor-patch:
        update-types: [minor, patch]
    # Must match the Playwright image, see the /web entry.
    ignore:
      - dependency-name: "@playwright/test"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    # The image stays on Node 24 (the LTS line used for web and site); a new major is a deliberate move.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    # A new PostgreSQL major cannot read the data directory of the old one: it needs a dump and restore or
    # pg_upgrade, documented in the update guide, so it is a deliberate move and not a dependency bump.
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
