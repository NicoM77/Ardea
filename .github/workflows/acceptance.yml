name: Acceptance

# Started by hand after a release: the published image on both architectures, from a fresh install.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Released version without the v, for example 0.1.1
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: acceptance-${{ inputs.version }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/nicom77/ardea

jobs:
  verify:
    name: Signature and attestations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Verify as the install guide does
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          identity='^https://github\.com/NicoM77/Ardea/\.github/workflows/release\.yml@refs/heads/main$'
          issuer=https://token.actions.githubusercontent.com
          signer=https://github.com/NicoM77/Ardea/.github/workflows/release.yml@refs/heads/main
          cosign verify "$IMAGE:$VERSION" --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" > /dev/null
          gh attestation verify "oci://$IMAGE:$VERSION" --repo NicoM77/Ardea --cert-identity "$signer" --deny-self-hosted-runners
          gh attestation verify "oci://$IMAGE:$VERSION" --repo NicoM77/Ardea --cert-identity "$signer" --deny-self-hosted-runners \
            --predicate-type https://cyclonedx.org/bom
          for arch in amd64 arm64; do
            digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" \
              --format "{{range .Manifest.Manifests}}{{if eq .Platform.Architecture \"$arch\"}}{{.Digest}}{{end}}{{end}}")
            [ -n "$digest" ] || { echo "::error::No $arch image for $VERSION"; exit 1; }
            echo "== $arch $digest"
            cosign verify "$IMAGE@$digest" --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" > /dev/null
            gh attestation verify "oci://$IMAGE@$digest" --repo NicoM77/Ardea --cert-identity "$signer" --deny-self-hosted-runners
          done

  flows:
    name: Fresh install (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The image reports the release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          docker pull --quiet "$IMAGE:$VERSION"
          [ "$(docker image inspect "$IMAGE:$VERSION" --format '{{.Architecture}}')" = "${{ matrix.arch }}" ]
          reported="$(docker run --rm "$IMAGE:$VERSION" version)"
          [ "$reported" = "$VERSION" ] || { echo "::error::The image reports '$reported' instead of '$VERSION'"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install
        working-directory: tests/e2e
        run: npm ci
      - name: Start the instance and run the flows
        run: tests/e2e/run.sh "$IMAGE:${{ inputs.version }}"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: acceptance-${{ matrix.arch }}
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          if-no-files-found: ignore
