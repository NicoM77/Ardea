name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  CI: "true"

# Time budget (master plan 13.7): pull request 15 minutes target, 25 minutes hard limit.
# Jobs run side by side; a job over its timeout is a defect to fix, not a limit to raise.
jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Restore
        run: dotnet restore Ardea.slnx --locked-mode
      - name: Format
        run: dotnet format Ardea.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build Ardea.slnx --no-restore -c Release
      - name: Test
        # A hanging test assembly fails after 8 minutes with its name, instead of the job's time limit
        # cancelling everything silently (seen once in Ardea.Platform.Tests).
        run: dotnet test --solution Ardea.slnx --no-build -c Release --timeout 8m

  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Excluded libraries
        run: python3 build/check-banned-packages.py
      - name: Restore
        run: dotnet restore Ardea.slnx --locked-mode
      - name: Licences
        run: mkdir -p artifacts && build/check-licenses.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: licences
          path: artifacts/nuget-licenses.md
          if-no-files-found: ignore

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      # The committed client must be what the committed OpenAPI document generates (master plan 10.1).
      - name: API client matches the OpenAPI document
        run: |
          npm run generate:api
          git status --porcelain -- projects/ardea/src/app/core/api/generated
          test -z "$(git status --porcelain -- projects/ardea/src/app/core/api/generated)"
      - name: Lint
        run: npm run lint
      - name: Translations
        run: npm run check:i18n
      - name: Design tokens
        run: npm run check:tokens
      - name: Licences
        run: npm run check:licenses
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  # Image comparison of the component library pages, on the main branch only (master plan 13.7).
  # The same image as for local runs, so the committed baselines match pixel for pixel.
  web-visual:
    name: Web visual comparison
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # The image ships Node 22.20; Angular CLI 22.2 needs 22.22 or 24.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      # The /ui pages exist in development builds only.
      - name: Build
        run: npx ng build ardea --configuration development --output-path dist/showcase
      - name: Compare
        run: npx playwright test --project visual
        env:
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore

  # The production build under the production Content Security Policy, on every pull request:
  # pages must load without a console error, so nothing that needs eval or inline script ships.
  web-csp:
    name: Web under CSP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Load pages under the policy
        run: npx playwright test --project csp
        env:
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: csp-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore

  # The core flows of master plan 13.6 against the real image behind Caddy, over HTTPS. The first
  # one is the acceptance of phase 0: healthy within 3 minutes, then setup token, password and TOTP.
  # The image is built here from the Image job's cache (read only), so both jobs run side by side.
  e2e:
    name: End to end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ardea:e2e
          cache-from: type=gha,scope=image-amd64
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install
        working-directory: tests/e2e
        run: npm ci
      - name: Licences
        working-directory: tests/e2e
        run: npm run check:licenses
      - name: Start the instance and run the flows
        run: tests/e2e/run.sh ardea:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          if-no-files-found: ignore

  image:
    name: Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ardea:ci
          cache-from: type=gha,scope=image-amd64
          cache-to: type=gha,mode=max,scope=image-amd64
      - name: Smoke test (compose up, healthy, doctor)
        run: build/smoke-test.sh ardea:ci
      - name: Build image (arm64, cross-compiled)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/arm64
          cache-from: type=gha,scope=image-arm64
          cache-to: type=gha,mode=max,scope=image-arm64
