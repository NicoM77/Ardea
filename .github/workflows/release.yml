name: Release

# release-please keeps the release PR up to date. Merging it creates the tag and a draft release; the jobs below
# then build, check, sign and attest the images and publish the release (ADR 0050). A tag set with GITHUB_TOKEN
# starts no other workflow, so all of it lives here.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/nicom77/ardea
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

# Time budget (master plan 13.7): 25 minutes from the merge to the published release, about 18 expected.
jobs:
  release-please:
    name: Release PR and tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  sbom:
    name: SBOM and notices
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: SBOM and notices
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          npm ci --prefix web --no-audit --no-fund
          dotnet restore src/Hosts/Ardea.Host/Ardea.Host.csproj --locked-mode
          build/sbom.sh artifacts/sbom
          build/third-party-notices.sh artifacts/THIRD-PARTY-NOTICES.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom
          path: |
            artifacts/sbom/
            artifacts/THIRD-PARTY-NOTICES.md
          if-no-files-found: error
          retention-days: 7

  image:
    name: Images
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The release is published only from an image that passed the smoke test and reports its version.
      - name: Build (amd64) for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          build-args: VERSION=${{ needs.release-please.outputs.version }}
          provenance: false
          load: true
          tags: ardea:release
      - name: Version and smoke test
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          reported="$(docker run --rm ardea:release version)"
          [ "$reported" = "$VERSION" ] || { echo "::error::The image reports '$reported' instead of '$VERSION'"; exit 1; }
          build/smoke-test.sh ardea:release
      - name: Tags
        id: tags
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          IFS=. read -r major minor _ <<< "${VERSION%%-*}"
          {
            echo "list<<EOF"
            echo "$IMAGE:$VERSION"
            if [ "$VERSION" = "${VERSION%%-*}" ]; then
              echo "$IMAGE:$major.$minor"
              echo "$IMAGE:$major"
              [ "$major" = "0" ] || echo "$IMAGE:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The SDK stage cross-compiles for arm64 and the runtime stage runs no command, so no emulation is needed.
      - name: Build and push (amd64, arm64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.release-please.outputs.version }}
          provenance: false
          sbom: false
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.title=Ardea
            org.opencontainers.image.description=Self-hosted vulnerability early warning
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.release-please.outputs.version }}
            org.opencontainers.image.revision=${{ needs.release-please.outputs.sha }}
      - name: Platform digests
        id: platforms
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          index="$(docker buildx imagetools inspect --raw "$IMAGE@$DIGEST")"
          for arch in amd64 arm64; do
            digest="$(jq -r --arg arch "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' <<< "$index")"
            [ -n "$digest" ] || { echo "::error::No $arch image in $DIGEST"; exit 1; }
            echo "$arch=$digest" >> "$GITHUB_OUTPUT"
          done
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign (keyless, the workflow's OIDC identity)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes --recursive "$IMAGE@$DIGEST"
      - name: Provenance (index)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Provenance (amd64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.platforms.outputs.amd64 }}
          push-to-registry: true
          create-storage-record: false
      - name: Provenance (arm64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.platforms.outputs.arm64 }}
          push-to-registry: true
          create-storage-record: false

  publish:
    name: Publish the release
    needs: [release-please, sbom, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sbom
          path: artifacts
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: SBOM attestation (.NET)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.image.outputs.digest }}
          sbom-path: artifacts/sbom/ardea-dotnet.cdx.json
          push-to-registry: true
          create-storage-record: false
      - name: SBOM attestation (web app)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.image.outputs.digest }}
          sbom-path: artifacts/sbom/ardea-web.cdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Attach files and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
          VERSION: ${{ needs.release-please.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            artifacts/sbom/ardea-dotnet.cdx.json \
            artifacts/sbom/ardea-web.cdx.json \
            artifacts/THIRD-PARTY-NOTICES.md \
            deploy/compose.yaml \
            deploy/compose.caddy.yaml \
            deploy/Caddyfile
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          {
            echo
            echo "### Image"
            echo
            echo "\`$IMAGE:$VERSION\` (\`linux/amd64\`, \`linux/arm64\`), index digest \`$DIGEST\`."
            echo "Signed with cosign and attested with build provenance and SBOM; to check them, see"
            echo "[Installation](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/operations/installation.md#verify-the-image)."
          } >> notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md --draft=false
