name: Release

# release-please keeps the release PR up to date. Merging it creates the tag and a draft release; the jobs below
# build, sign and attest the images, wait for CI on the release commit, set the image tags last and publish the
# release (ADR 0050). A tag set with GITHUB_TOKEN starts no other workflow, so all of it lives here.
# Started by hand on main with an existing tag, it builds, signs and publishes that tag again (recovery).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, sign and publish again (vX.Y.Z)
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/nicom77/ardea
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

# Time budget (master plan 13.7): 25 minutes from the merge to the published release, about 20 expected.
jobs:
  release-please:
    name: Release PR and tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  target:
    name: Release to build
    needs: release-please
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.created == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      version: ${{ steps.target.outputs.version }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASED_TAG: ${{ needs.release-please.outputs.tag }}
          RELEASED_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::Start the workflow from main, so the signatures carry main's identity"; exit 1; }
            [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::'$INPUT_TAG' is not a release tag (vX.Y.Z)"; exit 1; }
            tag="$INPUT_TAG"
            sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"
          else
            tag="$RELEASED_TAG"
            sha="$RELEASED_SHA"
          fi
          [ -n "$tag" ] && [ -n "$sha" ] || { echo "::error::No tag or commit to release"; exit 1; }
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from $sha"

  ci:
    name: CI passed on the release commit
    needs: target
    if: ${{ !cancelled() && needs.target.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Wait for a green CI run
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.target.outputs.sha }}
        run: |
          commit="$SHA"
          changed="$(git diff --name-only "$SHA^1" "$SHA")"
          if [ -n "$changed" ] && ! grep -qvE '^docs/|\.md$' <<< "$changed"; then
            commit="$(git rev-parse "$SHA^1")"
            echo "Only documentation changed in $SHA, which CI skips: its first parent $commit counts."
          fi
          deadline=$((SECONDS + 1500))
          while :; do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$commit" --json status,conclusion,event,url \
              --jq '[.[] | select(.event == "push" or .event == "workflow_dispatch")]')"
            if jq -e 'any(.[]; .conclusion == "success")' <<< "$runs" > /dev/null; then
              echo "CI passed on $commit: $(jq -r '[.[] | select(.conclusion == "success")][0].url' <<< "$runs")"
              exit 0
            fi
            if jq -e 'length > 0 and all(.[]; .status == "completed")' <<< "$runs" > /dev/null; then
              echo "::error::CI failed on $commit. Fix it or re-run CI, then re-run the failed jobs of this run."
              exit 1
            fi
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::No finished CI run on $commit within 25 minutes"; exit 1; }
            sleep 30
          done

  sbom:
    name: SBOM and notices
    needs: target
    if: ${{ !cancelled() && needs.target.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: SBOM and notices
        env:
          VERSION: ${{ needs.target.outputs.version }}
        run: |
          npm ci --prefix web --no-audit --no-fund
          dotnet restore src/Hosts/Ardea.Host/Ardea.Host.csproj --locked-mode
          build/sbom.sh artifacts/sbom
          build/third-party-notices.sh artifacts/THIRD-PARTY-NOTICES.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom
          path: |
            artifacts/sbom/
            artifacts/THIRD-PARTY-NOTICES.md
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # Pushed by digest only: no tag points at the image until publish, after signing, attesting and CI.
  image:
    name: Images (amd64, arm64)
    needs: target
    if: ${{ !cancelled() && needs.target.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      amd64: ${{ steps.platforms.outputs.amd64 }}
      arm64: ${{ steps.platforms.outputs.arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The SDK stage cross-compiles for arm64 and the runtime stage runs no command, so no emulation is needed.
      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.target.outputs.version }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.title=Ardea
            org.opencontainers.image.description=Self-hosted vulnerability early warning
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.target.outputs.version }}
            org.opencontainers.image.revision=${{ needs.target.outputs.sha }}
      - name: Platform digests
        id: platforms
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          index="$(docker buildx imagetools inspect --raw "$IMAGE@$DIGEST")"
          for arch in amd64 arm64; do
            digest="$(jq -r --arg arch "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' <<< "$index")"
            [ -n "$digest" ] || { echo "::error::No $arch image in $DIGEST"; exit 1; }
            echo "$arch=$digest" >> "$GITHUB_OUTPUT"
          done
      - name: The image reports the release version
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ needs.target.outputs.version }}
        run: |
          reported="$(docker run --rm --platform linux/amd64 "$IMAGE@$DIGEST" version)"
          [ "$reported" = "$VERSION" ] || { echo "::error::The image reports '$reported' instead of '$VERSION'"; exit 1; }

  sign:
    name: Sign and attest provenance
    needs: [image, ci]
    if: ${{ !cancelled() && needs.image.result == 'success' && needs.ci.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign (keyless, the workflow's OIDC identity)
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: cosign sign --yes --recursive "$IMAGE@$DIGEST"
      - name: Provenance (index)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Provenance (amd64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.image.outputs.amd64 }}
          push-to-registry: true
          create-storage-record: false
      - name: Provenance (arm64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.image.outputs.arm64 }}
          push-to-registry: true
          create-storage-record: false

  publish:
    name: Tag the images and publish the release
    needs: [target, sbom, image, sign]
    if: ${{ !cancelled() && needs.sbom.result == 'success' && needs.sign.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sbom
          path: artifacts
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: SBOM attestation (.NET)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.image.outputs.digest }}
          sbom-path: artifacts/sbom/ardea-dotnet.cdx.json
          push-to-registry: true
          create-storage-record: false
      - name: SBOM attestation (web app)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.image.outputs.digest }}
          sbom-path: artifacts/sbom/ardea-web.cdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Attach files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.target.outputs.tag }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            artifacts/sbom/ardea-dotnet.cdx.json \
            artifacts/sbom/ardea-web.cdx.json \
            artifacts/THIRD-PARTY-NOTICES.md \
            deploy/compose.yaml \
            deploy/compose.caddy.yaml \
            deploy/Caddyfile
      - name: Image tags
        env:
          VERSION: ${{ needs.target.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          docker buildx imagetools create -t "$IMAGE:$VERSION" "$IMAGE@$DIGEST"
          tagged="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')"
          [ "$tagged" = "$DIGEST" ] || { echo "::error::$IMAGE:$VERSION points at $tagged instead of $DIGEST"; exit 1; }
          if [ "$VERSION" = "${VERSION%%-*}" ]; then
            IFS=. read -r major minor _ <<< "$VERSION"
            tags=(-t "$IMAGE:$major.$minor" -t "$IMAGE:$major")
            [ "$major" = "0" ] || tags+=(-t "$IMAGE:latest")
            docker buildx imagetools create "${tags[@]}" "$IMAGE@$DIGEST"
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.target.outputs.tag }}
          VERSION: ${{ needs.target.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          if ! grep -q '^### Image$' notes.md; then
            {
              echo
              echo "### Image"
              echo
              echo "\`$IMAGE:$VERSION\` (\`linux/amd64\`, \`linux/arm64\`), index digest \`$DIGEST\`."
              echo "Signed with cosign and attested with build provenance and SBOM; to check them, see"
              echo "[Installation](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/operations/installation.md#verify-the-image)."
            } >> notes.md
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md --draft=false
      - name: Republish the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --repo "$GITHUB_REPOSITORY" --ref main
