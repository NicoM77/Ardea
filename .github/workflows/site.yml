name: Website

# NOT ENABLED (task 7.9 of the roadmap): this workflow runs only when started by hand, and publishing needs the
# owner's decision first. GitHub Pages for a private repository depends on the account's plan, and Actions minutes
# are used up until task 7.13. Before the first run: Settings → Pages → Source «GitHub Actions».
# Once Pages is on, the triggers of the plan replace `workflow_dispatch` alone:
#
#   on:
#     release:
#       types: [published]
#     push:
#       branches: [main]
#       paths: ["docs/**", "README.md", "SECURITY.md", "CONTRIBUTING.md", "openapi/**", "site/**"]
#     workflow_dispatch:
#
# The site is built from docs/, README.md, SECURITY.md, CONTRIBUTING.md and openapi/ardea.v1.json (site/README.md).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  CI: "true"

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        run: npm ci
      - name: Licences
        run: npm run check:licenses
      - name: Build
        run: npm run build
      - name: Links
        run: npm run check:links
      - name: Accessibility
        run: npm run check:a11y
        env:
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: site-a11y-report
          path: |
            site/playwright-report
            site/test-results
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
