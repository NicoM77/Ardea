<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Actions · Ardea (mockup, sample data)</title>
<link rel="icon" href="../brand/ardea-favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body data-page="actions">
<main class="sheet" id="main">
  <div class="content">

    <header class="title-row">
      <div>
        <h1>Actions</h1>
        <p class="title-sub" id="summary" role="status"></p>
      </div>
      <div class="title-actions">
        <label>
          <span class="sr-only">Project</span>
          <select class="select" id="project"></select>
        </label>
        <label class="search">
          <span class="sr-only">Search actions</span>
          <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
          <input class="input" type="search" id="q" placeholder="Component, CVE or project" autocomplete="off">
        </label>
      </div>
    </header>

    <div class="grid">
      <div class="span-9">
        <div class="tabs" role="tablist" aria-label="Show">
          <button type="button" role="tab" data-view="open" aria-selected="true">Open <span class="count" data-count="open"></span></button>
          <button type="button" role="tab" data-view="closed" aria-selected="false">Closed <span class="count" data-count="closed"></span></button>
          <span class="tabs-ink" aria-hidden="true"></span>
        </div>

        <div class="toolbar">
          <div class="chips" role="group" aria-label="Filter" id="chips"></div>
        </div>

        <div class="atable">
          <div class="atable-head" aria-hidden="true">
            <span>Priority</span><span>Action</span><span id="head-time">Time left</span><span>Owner</span><span>Status</span>
          </div>
          <div id="rows"></div>
        </div>

        <div class="empty" id="empty" hidden>
          <p id="empty-text"></p>
          <button class="btn" type="button" id="clear">Clear filters</button>
        </div>

        <p class="footnote" id="dismissed"></p>
      </div>

      <div class="stack span-3">
        <section class="card rise" aria-labelledby="h-owners">
          <header><h2 id="h-owners">Owners</h2><span class="meta" id="owners-meta"></span></header>
          <div class="rows" id="owners"></div>
        </section>
        <section class="card rise" aria-labelledby="h-speed">
          <header><h2 id="h-speed">Time to close</h2><span class="meta" id="speed-meta"></span></header>
          <div id="speed"></div>
        </section>
      </div>
    </div>

    <p class="footnote">Mockup with sample data. The CVE identifiers are real; the organization, people, projects, installed versions and every closed action are invented. Every row opens the same example action.</p>
  </div>
</main>
<script src="data.js"></script>
<script src="app.js"></script>
<script src="charts.js"></script>
<script>
(function () {
  'use strict';
  var D = window.ARDEA, A = window.A, C = window.C, F = D.fmt;
  var byId = function (id) { return document.getElementById(id); };
  var DEADLINE_DAYS = { critical: 2, high: 7, medium: 30, low: 90 };

  /* ---------- Rows ---------- */
  function rowHead(a, kind, text) {
    return ' style="view-transition-name:row-' + a.id + (kind === 'closed' ? ';--c:var(--positive)' : '') + '" data-kind="' + kind + '" data-project="' + a.project +
      '" data-priority="' + a.priority + '" data-owner="' + (a.assignee || '') + '" data-text="' + A.esc(text.toLowerCase()) + '">' +
      A.prio(a.priority);
  }
  function title(a, extra) {
    return '<span class="arow-title"><span class="prio prio--' + a.priority + ' phone-prio">' + A.sym(D.PRIORITIES[a.priority].sym) + '</span><b data-title>' + A.esc(a.title) + '</b>' + (extra || '') + '</span>';
  }

  function openRow(a) {
    var project = D.project(a.project).name;
    var used = Math.max(0, Math.min(1, (D.NOW - a.created) / (a.due - a.created)));
    var more = a.findings > 1 ? ' +' + (a.findings - 1) : '';
    return '<a class="arow c-' + a.priority + '" href="' + a.href + '"' + (a.id === 'puppet' ? ' data-morph' : '') +
      rowHead(a, 'open', a.title + ' ' + a.cve + ' ' + a.component + ' ' + project) +
      '<span class="arow-main">' +
        title(a, (a.exploited ? '<span class="pill pill--alert">Exploited</span>' : '') + (a.noFix ? '<span class="pill">No fix yet</span>' : '')) +
        '<span class="arow-sub">' + A.esc(project) + ' · ' + a.installed + ' · <span class="id">' + a.cve + '</span>' + more + '</span>' +
      '</span>' +
      '<span class="arow-due"><span class="meter-line"><b data-left="' + a.id + '"></b><span>' + (a.due - D.NOW < 2 * D.DAY ? F.when(a.due) : F.day(a.due)) + '</span></span>' +
        '<span class="meter" role="img" aria-label="' + Math.round(used * 100) + '% of the time used"><i style="transform:scaleX(' + used.toFixed(3) + ')"></i></span></span>' +
      '<span class="arow-meta">' + A.who(a.assignee) + A.status(a.status) + '</span>' +
    '</a>';
  }

  function closedRow(a) {
    var project = D.project(a.project).name, limit = DEADLINE_DAYS[a.priority];
    var share = Math.min(1, a.days / limit);
    return '<div class="arow c-' + a.priority + '"' + rowHead(a, 'closed', a.title + ' ' + project) +
      '<span class="arow-main">' + title(a) + '<span class="arow-sub">' + A.esc(project) + ' · closed ' + F.day(a.closed) + '</span></span>' +
      '<span class="arow-due"><span class="meter-line"><b>' + F.duration(a.days) + '</b><span>of ' + limit + ' d</span></span>' +
        '<span class="meter" role="img" aria-label="' + Math.round(share * 100) + '% of the allowed time"><i style="transform:scaleX(' + share.toFixed(3) + ')"></i></span></span>' +
      '<span class="arow-meta">' + A.who(a.assignee) + A.status(a.status) + '</span>' +
    '</div>';
  }

  byId('rows').innerHTML = D.ACTIONS.map(openRow).join('') + D.CLOSED.map(closedRow).join('');
  var rows = A.$$('#rows .arow');
  C.clock();

  /* ---------- Filters ---------- */
  var view = 'open', priorities = {}, unassigned = false;
  var project = byId('project'), search = byId('q');

  project.innerHTML = '<option value="">All projects</option>' + D.PROJECTS.map(function (p) { return '<option value="' + p.id + '">' + A.esc(p.name) + '</option>'; }).join('');
  byId('chips').innerHTML = D.byPriority.map(function (p) {
    return '<button class="chip c-' + p.priority + '" type="button" data-chip="' + p.priority + '" aria-pressed="false">' + A.sym(D.PRIORITIES[p.priority].sym) + D.PRIORITIES[p.priority].label + ' <b></b></button>';
  }).join('') + '<button class="chip" type="button" data-chip="unassigned" aria-pressed="false">Unassigned <b></b></button>';
  var chips = A.$$('[data-chip]');

  /* #critical presets a priority, #webshop a project */
  var preset = location.hash.replace('#', '');
  if (D.PRIORITIES[preset]) priorities[preset] = true;
  else if (D.project(preset)) project.value = preset;

  var tabs = A.$$('[data-view]');
  var slide = A.slider(A.$('.tabs'), A.$('.tabs-ink'), '[aria-selected="true"]');

  function matches(row, ignore) {
    var q = search.value.trim().toLowerCase();
    var anyPriority = Object.keys(priorities).some(function (k) { return priorities[k]; });
    return row.getAttribute('data-kind') === view &&
      (!project.value || row.getAttribute('data-project') === project.value) &&
      (ignore === 'priority' || !anyPriority || priorities[row.getAttribute('data-priority')]) &&
      (ignore === 'owner' || !unassigned || !row.getAttribute('data-owner')) &&
      (!q || row.getAttribute('data-text').indexOf(q) !== -1);
  }

  /* Who holds the rows in view: one block per action, in its priority's colour */
  function owners(shown) {
    var keys = [''].concat(Object.keys(D.PEOPLE)), most = 1;
    var groups = keys.map(function (k) {
      var mine = shown.filter(function (row) { return row.getAttribute('data-owner') === k; })
        .sort(function (x, y) { return D.PRIORITIES[x.getAttribute('data-priority')].rank - D.PRIORITIES[y.getAttribute('data-priority')].rank; });
      most = Math.max(most, mine.length);
      return { key: k, rows: mine };
    }).filter(function (g) { return g.rows.length || g.key; });
    byId('owners-meta').textContent = shown.length + (view === 'open' ? ' open' : ' closed');
    byId('owners').innerHTML = groups.map(function (g) {
      var p = D.PEOPLE[g.key];
      return '<div data-owner-row="' + g.key + '">' + A.who(g.key || null) +
        '<span class="row-main"><b' + (p ? '' : ' class="muted"') + '>' + (p ? A.esc(p.name) : 'Unassigned') + '</b></span>' +
        '<span class="blocks tight">' + g.rows.map(function (row) { return '<i class="c-' + row.getAttribute('data-priority') + '"></i>'; }).join('') + '</span>' +
        '<span class="count">' + g.rows.length + '</span></div>';
    }).join('');
    A.$$('[data-owner-row]').forEach(function (el) {
      var key = el.getAttribute('data-owner-row');
      el.addEventListener('pointerenter', function () { rows.forEach(function (row) { row.classList.toggle('is-dim', row.getAttribute('data-owner') !== key); }); });
      el.addEventListener('pointerleave', function () { rows.forEach(function (row) { row.classList.remove('is-dim'); }); });
    });
  }

  function apply() {
    var shown = rows.filter(function (row) { var ok = matches(row); row.hidden = !ok; return ok; });

    /* Counts follow the view: each chip says how many rows it would leave */
    chips.forEach(function (chip) {
      var key = chip.getAttribute('data-chip');
      var n = D.count(rows, function (row) {
        return key === 'unassigned' ? matches(row, 'owner') && !row.getAttribute('data-owner')
          : matches(row, 'priority') && row.getAttribute('data-priority') === key;
      });
      A.$('b', chip).textContent = n;
      chip.setAttribute('aria-pressed', String(key === 'unassigned' ? unassigned : !!priorities[key]));
      chip.hidden = key === 'unassigned' && view === 'closed';
    });
    A.$('[data-count="open"]').textContent = D.ACTIONS.length;
    A.$('[data-count="closed"]').textContent = D.CLOSED.length;
    tabs.forEach(function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-view') === view)); });
    byId('head-time').textContent = view === 'open' ? 'Time left' : 'Time to close';

    var total = view === 'open' ? D.ACTIONS.length : D.CLOSED.length, summary;
    if (shown.length !== total) summary = '<strong>' + shown.length + ' of ' + total + '</strong> ' + view + ' actions match.';
    else if (view === 'open') summary = '<strong>' + total + ' open.</strong> ' + D.count(D.ACTIONS, function (a) { return a.priority === 'critical'; }) + ' critical, ' + D.count(D.ACTIONS, function (a) { return !a.assignee; }) + ' unassigned.';
    else summary = '<strong>' + total + ' closed since ' + F.day(D.CLOSED[D.CLOSED.length - 1].created) + '.</strong> ' + D.remediated.length + ' remediated, ' + (total - D.remediated.length) + ' not affected.';
    byId('summary').innerHTML = summary;

    A.$('.atable').hidden = shown.length === 0;
    byId('empty').hidden = shown.length !== 0;
    byId('empty-text').textContent = 'No ' + view + ' actions match these filters.';
    byId('dismissed').hidden = view !== 'open' || shown.length === 0;
    owners(shown);
  }

  function change(fn, animate) {
    if (animate === false) { fn(); apply(); return; }
    A.transition(function () { fn(); apply(); });
  }

  tabs.forEach(function (tab) {
    tab.addEventListener('click', function (e) {
      /* A click slides the indicator; the keyboard just moves it */
      change(function () { view = tab.getAttribute('data-view'); if (view === 'closed') unassigned = false; }, e.detail > 0);
      slide(e.detail > 0);
    });
  });
  chips.forEach(function (chip) {
    chip.addEventListener('click', function (e) {
      var key = chip.getAttribute('data-chip');
      change(function () { if (key === 'unassigned') unassigned = !unassigned; else priorities[key] = !priorities[key]; }, e.detail > 0);
    });
  });
  project.addEventListener('change', function () { change(function () {}); });
  search.addEventListener('input', function () { change(function () {}, false); });
  byId('clear').addEventListener('click', function () {
    change(function () { priorities = {}; unassigned = false; project.value = ''; search.value = ''; });
  });

  byId('dismissed').textContent = F.int(D.FUNNEL.dismissed) + ' more records named a technology you run this week and were dismissed: the installed version is outside the affected range, or the product is a variant that is not affected.';

  /* ---------- Time to close: the median of the remediated actions against the time each priority allows ---------- */
  function median(values) {
    var s = values.slice().sort(function (x, y) { return x - y; }), m = Math.floor(s.length / 2);
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  }
  byId('speed-meta').textContent = D.remediated.length + ' remediated';
  byId('speed').innerHTML = D.byPriority.map(function (p) {
    var days = D.remediated.filter(function (a) { return a.priority === p.priority; }).map(function (a) { return a.days; });
    var limit = DEADLINE_DAYS[p.priority];
    if (!days.length) return '<div class="speed">' + A.prio(p.priority) + '<span class="muted">None closed yet</span><span class="meter"></span></div>';
    var mid = median(days);
    return '<div class="speed" style="--c:var(--positive)">' + A.prio(p.priority) + '<span><b>' + F.duration(mid) + '</b> of ' + limit + ' d</span>' +
      '<span class="meter" role="img" aria-label="Median ' + F.duration(mid) + ' of ' + limit + ' days allowed, ' + days.length + ' closed"><i style="transform:scaleX(' + Math.min(1, mid / limit).toFixed(3) + ')"></i></span></div>';
  }).join('');

  apply();
  A.$$('.arow:not([hidden]) .meter i, .speed .meter i').forEach(function (bar, k) {
    if (A.reduced || !bar.animate) return;
    bar.animate([{ transform: 'scaleX(0)' }, { transform: bar.style.transform }], { duration: 600, delay: 100 + k * 50, easing: A.EASE_OUT, fill: 'backwards' });
  });
})();
</script>
</body>
</html>
